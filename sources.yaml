    convert: domain_suffix

  # ============================================================
  # SERVICES — IPv4 SUBNETS (Subnets/IPv4/*.lst, mode: ip_cidr)
  # All with no_resolve: DNS lookups not triggered.
  # Capitalized duplicates (Discord/Meta/Twitter.lst) skipped — identical content.
  # ============================================================
