# SR rule-sets builder — sources configuration
# Targets branch: SR_remote_itdog
#
# Conversion modes:
#   passthrough    — copy as-is (source already in SR format)
#   domain_suffix  — bare domains  → DOMAIN-SUFFIX,<domain>
#   ip_cidr        — bare CIDRs    → IP-CIDR,<cidr>[,no-resolve]

sources:
  # ============================================================
  # MAIN DOMAIN LIST (already SR-compatible, passthrough)
  # ============================================================
  - name: itdog-inside
    url: https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Russia/inside-clashx.lst
    convert: passthrough

  # ============================================================
  # SERVICES — DOMAINS (Services/*.lst, mode: domain_suffix)
  # NOTE: most of these are already covered by itdog-inside above.
  # Kept separate for granular service-level toggling.
  # ============================================================
  - name: itdog-svc-cloudflare
    url: https://raw.githubusercontent.com/itdoginfo/allow-domains/refs/heads/main/Services/cloudflare.lst
    convert: domain_suffix

  - name: itdog-svc-cloudfront
    url: https://raw.githubusercontent.com/itdoginfo/allow-domains/refs/heads/main/Services/cloudfront.lst
    convert: domain_suffix

